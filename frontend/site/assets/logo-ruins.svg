<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    This SVG is used as a CSS mask (see style.css).
    Firefox interprets SVG mask luminance differently from Chromium/WebKit.
    Using WHITE shapes makes the mask consistently opaque across browsers.
  -->
  <path fill="white" d="M12 5L4 10h16z"/>
  <rect x="7" y="11" width="2" height="8" fill="white"/>
  <rect x="11" y="11" width="2" height="8" fill="white"/>
  <rect x="15" y="11" width="2" height="8" fill="white"/>
</svg>
