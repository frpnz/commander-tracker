<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Archivio • Commander Tracker</title>
  <link rel="stylesheet" href="../assets/style.css?v=20260209"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-label="Commander Tracker"></div>
      <div>
        <div class="title">Archivio</div>
        <div class="subtitle" id="subtitle">Info decks</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="meta" id="meta"></div>
      <nav class="nav" id="nav"></nav>
      <a class="help-icon" href="../metrics/" aria-label="Guida alle metriche" title="Guida alle metriche">?</a>
    </div>
  </header>

  <main class="container">
    <section class="card filters">
      <div class="filters-row">
        <label>
          Player
          <select id="fPlayer">
            <option value="">Tutti i giocatori</option>
          </select>
        </label>

        <label>
          Commander
          <select id="fCommander">
            <option value="">Tutti i commander</option>
          </select>
        </label>

        <label>
          Bracket
          <select id="fBracket">
            <option value="">Tutti i bracket</option>
          </select>
        </label>

        <label>
          Numero player
          <select id="fPodSize">
            <option value="">Tutti</option>
          </select>
        </label>

        <div class="actions">
          <button id="btnReset" class="btn">Reset</button>
        </div>
      <div class="muted" style="margin-top:10px; font-size:12px; opacity:.85;">Suggerimento: scegli almeno un filtro per attivare “Elenco”. Le “Ultime partite” seguono i filtri selezionati.</div>
      </div>
      <div class="hint" id="hint"></div>
    </section>

    <section class="grid">
      <section class="card">
        <div class="card-head">
          <h2>Elenco</h2>
          <div class="head-tools">
            <div class="pill" id="countList"></div>
          </div>
        </div>
        <div class="hint" id="listGate" style="display:none"></div>
        <div class="table-wrap" id="listTableWrap">
          <table id="tList">
            <thead>
              <tr>
                <th>Player</th>
                <th>Commander</th>
                <th>Bracket</th>
                <th class="num">Partite</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Ultime partite</h2>
          <div class="head-tools">
            <label class="sortlabel">
              <span>Mostra</span>
              <select id="fRecentN" class="sortselect">
                <option value="3" selected>3</option>
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all">Tutte</option>
              </select>
            </label>
            <div class="pill" id="countRecent"></div>
          </div>
        </div>
        <div id="recentWrap" class="recent-wrap"></div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <span class="muted">Static site • GitHub Pages friendly</span>
  </footer>

  <script src="../assets/archive.js?v=20260203"></script>

  <script src="../assets/nav-items.js?v=20260223"></script>
  <script src="../assets/nav.js?v=20260223"></script>
</body>
</html>
