<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Commander Stats</title>
  <link rel="stylesheet" href="../assets/style.css?v=20260203"/>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-label="Commander Tracker"></div>
      <div>
        <div class="title">Commander Stats</div>
        <div class="subtitle" id="subtitle">Win rate aggregati e filtrabili</div>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <nav class="nav" id="nav"></nav>
  </header>

  <main class="container">
    <section class="card filters">
      <div class="filters-row">
        <label>
          Player
          <select id="fPlayer">
            <option value="">Tutti</option>
          </select>
        </label>
      </div>
      <div class="hint" id="hint"></div>
    </section>

    <section class="charts">
      <section class="card">
        <div class="card-head">
          <h2 id="chartTitle">Winrate per player</h2>
          <div class="head-tools">
            <div class="pill" id="chartInfo"></div>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="winrateBar" aria-label="Istogramma winrate per player" role="img"></canvas>
        </div>
      </section>

      <section class="card" id="bubbleCard">
        <div class="card-head">
          <h2>Winrate vs Partite</h2>
        </div>
        <div class="chart-wrap">
          <canvas id="winrateBubble" aria-label="Bubble plot winrate vs partite" role="img"></canvas>
        </div>
      </section>
    </section>

    <!-- Tabelle rimosse: manteniamo solo i grafici -->

    <footer class="footer">
      <span>Static site per GitHub Pages · dati da SQLite</span>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="../assets/player-colors.js?v=20260204"></script>
  <script src="../assets/stats.js?v=20260203"></script>

  <script src="../assets/nav.js?v=20260203"></script>
</body>
</html>
