<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Commander Tempio's Tracker</title>
  <link rel="stylesheet" href="assets/style.css?v=20260209"/>
</head>
<body class="home">
  <header class="topbar">
    <div class="brand">
      <a class="logo" href="./" aria-label="Commander Tracker"></a>
      <div>
        <div class="title">Commander Tempio's Tracker</div>
        <div class="subtitle">Dashboard statica · dati da SQLite · export deterministico</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
</header>

  <main class="wrap">
    <section class="card hero home-hero">
      <div class="home-copy">
        <h1>Commander Tracker</h1>
        <p class="muted">Vista mobile-first: leggera, veloce, senza CTA ridondanti.</p>
        <p class="muted" style="margin-top:8px; opacity:.9;">Usa la <b>navbar</b> per navigare tra Archivio, Stats e il resto.</p>
      </div>

      <picture class="home-visual" aria-hidden="true">
        <!-- Mobile-first: carica un asset piccolo (768w) come default, poi scala con srcset -->
        <source
          type="image/webp"
          srcset="assets/home-768.webp 768w, assets/home.webp 1536w"
          sizes="(max-width: 520px) 92vw, (max-width: 860px) 760px, 760px"
        />
        <img
          src="assets/home-768.webp"
          alt=""
          loading="lazy"
          decoding="async"
          fetchpriority="low"
          width="1536"
          height="1024"
        />
      </picture>
    </section>
  </main>

  <footer class="footer">
    <span class="muted">By Tempio • GitHub Pages friendly</span>
  </footer>

  <script src="assets/nav.js?v=20260209"></script>
</body>
</html>
